flush ruleset

define EXT_IF    = "eth0"
define DMZ_IF    = "eth1"

define EXT_IP    = 192.168.122.2
define WEB_IP    = 10.0.0.34
define FW2_IP    = 10.0.0.46
define ADMIN_IP  = 10.0.0.50

define INT_NET   = 10.0.0.0/27
define DMZ_NET   = 10.0.0.32/28
define MGMT_NET  = 10.0.0.48/29


table inet fw1_filter {

    chain input {
        type filter hook input priority 0;
        policy drop;

        # Local traffic
        iifname "lo" accept

        # Stateful firewall
        ct state invalid counter drop
        ct state { established, related } counter accept

        # DHCP reply for FW1 External interface
        iifname $EXT_IF udp sport 67 udp dport 68 counter accept

        # Admin workstation -> FW1 SSH
        iifname $DMZ_IF \
            ip saddr $ADMIN_IP \
            tcp dport 22 \
            ct state new counter accept
    }


    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Stateful firewall
        ct state invalid counter drop
        ct state { established, related } counter accept


        ######################################################
        # External -> protected networks
        ######################################################

        # External -> Internal
        iifname $EXT_IF \
            ip daddr $INT_NET \
            counter drop

        # External -> Management
        iifname $EXT_IF \
            ip daddr $MGMT_NET \
            counter drop


        ######################################################
        # Public Web Server
        ######################################################

        # External -> Web Server HTTPS
        iifname $EXT_IF oifname $DMZ_IF \
            ip daddr $WEB_IP \
            tcp dport 443 \
            ct state new counter accept


        #####################################################
        # Web Server -> External
        # #####################################################

        # DNS UDP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $WEB_IP \
            udp dport 53 \
            ct state new counter accept

        # DNS TCP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $WEB_IP \
            tcp dport 53 \
            ct state new counter accept

        # NTP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $WEB_IP \
            udp dport 123 \
            ct state new counter accept

        # HTTP / HTTPS
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $WEB_IP \
            tcp dport { 80, 443 } \
            ct state new counter accept


        ######################################################
        # FW2 -> External
        # Required for packages, DNS and time
        ######################################################

        # DNS UDP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $FW2_IP \
            udp dport 53 \
            ct state new counter accept

        # DNS TCP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $FW2_IP \
            tcp dport 53 \
            ct state new counter accept

        # NTP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $FW2_IP \
            udp dport 123 \
            ct state new counter accept

        # HTTP / HTTPS
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $FW2_IP \
            tcp dport { 80, 443 } \
            ct state new counter accept


        ######################################################
        # Internal -> External
        # Controlled Internet access
        # #####################################################

        # DNS UDP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $INT_NET \
            udp dport 53 \
            ct state new counter accept

        # DNS TCP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $INT_NET \
            tcp dport 53 \
            ct state new counter accept

        # NTP
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $INT_NET \
            udp dport 123 \
            ct state new counter accept

        # HTTP / HTTPS
        iifname $DMZ_IF oifname $EXT_IF \
            ip saddr $INT_NET \
            tcp dport { 80, 443 } \
            ct state new counter accept
    }
}


table ip fw1_nat {

    chain prerouting {
        type nat hook prerouting priority -100;

        # External HTTPS -> Web Server
        iifname $EXT_IF \
            ip daddr $EXT_IP \
            tcp dport 443 \
            counter dnat to $WEB_IP:443
    }


    chain postrouting {
        type nat hook postrouting priority 100;

        # Dynamic PAT equivalent
        # Private networks share FW1 External address
        oifname $EXT_IF \
            ip saddr { $INT_NET, $DMZ_NET, $MGMT_NET } \
            counter snat to $EXT_IP
    }
}

