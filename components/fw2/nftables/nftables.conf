flush ruleset

define DMZ_IF    = "eth0"
define INT_IF    = "eth1"
define MGMT_IF   = "eth2"

define FW1_IP    = 10.0.0.33
define WEB_IP    = 10.0.0.34
define ADMIN_IP  = 10.0.0.50

define DMZ_NET   = 10.0.0.32/28
define INT_NET   = 10.0.0.0/27
define MGMT_NET  = 10.0.0.48/29


table inet fw2_filter {

    chain input {
        type filter hook input priority 0;
        policy drop;

        # Local traffic
        iifname "lo" accept

        # Stateful firewall
        ct state invalid counter drop
        ct state { established, related } counter accept

        # Admin -> FW2 SSH
        iifname $MGMT_IF \
            ip saddr $ADMIN_IP \
            tcp dport 22 \
            ct state new counter accept

        # Admin -> FW2 ICMP
        iifname $MGMT_IF \
            ip saddr $ADMIN_IP \
            icmp type echo-request \
            counter accept
    }


    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Stateful firewall
        ct state invalid counter drop
        ct state { established, related } counter accept


        # -------------------------------------------------
        # DMZ isolation
        # -------------------------------------------------

        # DMZ -> Management
        iifname $DMZ_IF oifname $MGMT_IF \
            counter drop

        # DMZ -> Internal
        iifname $DMZ_IF oifname $INT_IF \
            counter drop


        # -------------------------------------------------
        # Management administration
        # -------------------------------------------------

        # Admin -> Web Server SSH
        iifname $MGMT_IF oifname $DMZ_IF \
            ip saddr $ADMIN_IP \
            ip daddr $WEB_IP \
            tcp dport 22 \
            ct state new counter accept

        # Admin -> FW1 SSH
        iifname $MGMT_IF oifname $DMZ_IF \
            ip saddr $ADMIN_IP \
            ip daddr $FW1_IP \
            tcp dport 22 \
            ct state new counter accept

        # Admin -> DMZ ICMP
        iifname $MGMT_IF oifname $DMZ_IF \
            ip saddr $ADMIN_IP \
            ip daddr $DMZ_NET \
            icmp type echo-request \
            counter accept

        # Admin -> Internal SSH
        iifname $MGMT_IF oifname $INT_IF \
            ip saddr $ADMIN_IP \
            ip daddr $INT_NET \
            tcp dport 22 \
            ct state new counter accept

        # Admin -> Internal ICMP
        iifname $MGMT_IF oifname $INT_IF \
            ip saddr $ADMIN_IP \
            ip daddr $INT_NET \
            icmp type echo-request \
            counter accept


        # -------------------------------------------------
        # Internal isolation
        # -------------------------------------------------

        # Internal -> DMZ
        iifname $INT_IF oifname $DMZ_IF \
            ip daddr $DMZ_NET \
            counter drop


        # -------------------------------------------------
        # Internal -> External through FW1
        # Only required services are allowed
        # -------------------------------------------------

        # DNS UDP
        iifname $INT_IF oifname $DMZ_IF \
            ip saddr $INT_NET \
            udp dport 53 \
            ct state new counter accept

        # DNS TCP
        iifname $INT_IF oifname $DMZ_IF \
            ip saddr $INT_NET \
            tcp dport 53 \
            ct state new counter accept

        # NTP
        iifname $INT_IF oifname $DMZ_IF \
            ip saddr $INT_NET \
            udp dport 123 \
            ct state new counter accept

        # HTTP / HTTPS
        iifname $INT_IF oifname $DMZ_IF \
            ip saddr $INT_NET \
            tcp dport { 80, 443 } \
            ct state new counter accept
    }
}
